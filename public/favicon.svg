<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 135 310 215" width="100%" height="100%" fill="none">
  <defs>
    <!-- Platinum / Metallic Silver Gradients for AR Letterforms -->
    <linearGradient id="metal-silver-a" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="metal-silver-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Dynamic Crimson Red Blade Gradient -->
    <linearGradient id="red-swoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="20%" stop-color="#991B1B"/>
      <stop offset="55%" stop-color="#DC2626"/>
      <stop offset="85%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>

    <!-- Red Accent Ambient Glow -->
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- PURE LOGO ONLY - 100% TRANSPARENT BACKGROUND (NO BOX / NO BACKGROUND TILE) -->
  <g id="ar-monogram-logo">
    
    <!-- 1. Upper Left Stalk & Apex of 'A' -->
    <path d="M 224 156
             L 246 166
             L 204 228
             L 165 285
             L 132 334
             L 112 334
             L 182 222
             Z"
          fill="url(#metal-silver-a)"/>

    <!-- 2. 'A' Top Segment & Connection -->
    <path d="M 224 156
             L 262 168
             L 242 202
             L 204 228
             Z"
          fill="url(#metal-silver-a)"/>

    <!-- 3. Upper Curved Bowl of 'R' -->
    <path d="M 244 168
             L 326 168
             C 358 168, 382 188, 382 220
             C 382 248, 360 268, 332 272
             L 292 272
             L 278 248
             L 325 248
             C 344 248, 356 236, 356 220
             C 356 200, 342 190, 322 190
             L 252 190
             Z"
          fill="url(#metal-silver-r)"/>

    <!-- 4. Sweeping Diagonal Leg of 'R' -->
    <path d="M 302 260
             L 330 260
             L 384 334
             L 332 334
             L 284 274
             Z"
          fill="url(#metal-silver-r)"/>

    <!-- Top Highlight Sheen Overlay for 3D Chiseled Look -->
    <path d="M 244 168 L 326 168 L 326 171 L 244 171 Z" fill="#FFFFFF" opacity="0.6"/>
    <path d="M 224 156 L 262 168 L 260 171 L 224 159 Z" fill="#FFFFFF" opacity="0.8"/>

    <!-- 5. Signature Dynamic Crimson Red Swoosh / Blade -->
    <path d="M 112 334
             C 142 305, 185 268, 235 242
             C 278 220, 318 202, 342 192
             C 308 208, 260 232, 218 258
             C 176 282, 140 312, 112 334
             Z"
          fill="url(#red-swoosh)"/>

    <path d="M 112 334
             L 160 332
             C 198 298, 246 264, 302 234
             L 342 192
             C 294 214, 238 250, 188 288
             C 158 310, 136 324, 112 334
             Z"
          fill="url(#red-swoosh)"
          filter="url(#red-glow)"/>

    <!-- Core Red Blade Body for maximum vibrant saturation -->
    <path d="M 112 334
             L 158 332
             C 196 298, 244 264, 302 234
             L 342 192
             C 296 212, 242 248, 192 286
             C 162 308, 138 322, 112 334
             Z"
          fill="url(#red-swoosh)"/>

    <!-- Top Specular Highlight on Red Blade Curve -->
    <path d="M 124 326
             C 165 292, 222 254, 285 224
             L 336 195
             C 280 220, 218 254, 162 294
             C 142 308, 128 318, 124 326
             Z"
          fill="#FFA4A4"
          opacity="0.45"/>

  </g>
</svg>
